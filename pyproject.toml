[project]
name = "chim-phase0-tools"
version = "0.1.0"
description = "Repository checks for the Chimwemwe school platform foundation"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "deps",
  "_build",
  "node_modules",
  "tmp",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

